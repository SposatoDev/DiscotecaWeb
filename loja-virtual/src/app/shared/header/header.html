<nav class="navbar navbar-expand-lg navbar-dark px-3">
  <div class="container-fluid">
    <a class="navbar-brand" (click)="irParaCentral()" style="cursor: pointer;">
      <img src="img/logo.png" alt="VinilShop" class="logo-imagem">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuHeader">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuHeader">
      <form class="d-flex mx-auto my-2 my-lg-0" style="max-width: 400px; width: 100%;"
            (ngSubmit)="buscar(campoBusca.value)">
        <input class="form-control" type="search" placeholder="Buscar discos, artistas..." #campoBusca>
        <button class="btn btn-buscar ms-2" type="submit">
          <i class="bi bi-search"></i> OK
        </button>
      </form>

      @if (usuarioLogado) {
        <a class="icone-usuario ms-lg-3" routerLink="/perfil">
          <i class="bi bi-person-circle"></i>
          <span class="nome-usuario d-none d-md-inline">{{ usuarioAtual?.nome?.split(' ')[0] }}</span>
        </a>
        <button class="btn btn-link text-white ms-2" type="button" (click)="sair()">Sair</button>
      } @else {
        <a class="icone-usuario ms-lg-3" routerLink="/login">
          <i class="bi bi-person-circle"></i>
        </a>
      }

      <a class="icone-carrinho ms-3" routerLink="/cesta">
        <i class="bi bi-cart3"></i>
      </a>
    </div>
  </div>
</nav>
